<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <script>
        let horas = prompt("Digite as horas: ", "00");

        let minutos = prompt("Digite os minutos: ", "00");

        let segundos = prompt("Digite os segundos: ", "00")

        let n = Math.round((minutos * 60) * (horas) + segundos)

        document.write ("Total de segundos: " , n)



       
    </script>
    
</body>
</html>
