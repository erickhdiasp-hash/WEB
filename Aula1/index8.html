<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <button type="button" onclick="calcularArea();">Função 1</button>
    <button type="button" onclick="calcularArea2();">Função 2</button>

    <form action="">
        <p>
            <label for="base">Base</label>
            <input type="number" name="base" id="base">
        </p>
        <p>
            <label for="altura">Altura</label>
            <input type="number" name="altura" id="altura">
        </p>
        <p>
            <label for="area">Calcular Area</label>
            <input type="number" name="area" id="area">
        </p>
        <p>
            <button type="button" onclick="calcularArea3();" id="btncalcularArea">Calcular Area</button>
        </p>
    </form>
    <form action="">
        <p>
            <label for="n1">N1</label>
            <input type="number" name="n1" id="n1">
        </p>
        <p>
            <label for="n2">N2</label>
            <input type="number" name="n2" id="n2">
        </p>
        <p>
            <button type="button" onclick="funcaoPrincipal();">Função 4</button>
        </p>
    </form>

    <script>
        function calcularArea(){
            let base = 3;
            let altura = 4;
            let area = base * altura;
            alert("Área: " + area);
        }

        function calcularArea2(base, altura){
            let area = base * altura;
            alert("Área: " + area);
        }

        function calcularArea3(){
            let base = parseFloat(document.getElementById("base").value);
            let altura = parseFloat(document.getElementById("altura").value);
            let area = base * altura;
            document.getElementById("area").value = area;

        }

        let btncalcularArea = document.getElementById("btncalcularArea");
        btncalcularArea.addEventListener("click", function(){
            let base = parseFloat(document.getElementById("base").value);
            let altura = parseFloat(document.getElementById("altura").value);
            let area = base * altura;
            document.getElementById("area").value = area;

        });

        function funcaoPrincipal(){
            let n1 = parseInt(document.getElementById("n1").value);
            let n2 = parseInt(document.getElementById("n2").value);
            //somar(n1, n2);
            alert("Soma: " + somar(n1,n2))
        }

        function somar(n1, n2){
            let soma = n1 + n2;
            //alert("Soma: " + soma);
            return soma; 
        }

        function alteraValor(n){
            n = 20;
            document.write("Valor de n dentro da função: ", n, "<br>");
        }

        let n = 10;
        document.write("Valor de n antes da função: ", n, "<br>");
        alteraValor(n);
        document.write("Valor de n depois da função: ", n, "<br>");

        function adicionaValor(lista){
            lista.push(4);
            document.write("Valores da lista dentro da função: ", lista, "<br>");
        }

        let numeros = ['1, 2,3'];
        document.write("valores da lista antes da função: ", numeros, "<br>");
        adicionaValor(numeros);
        document.write("Valores da lista depois da função: ", numeros, "<br>");
    </script>
    
</body>
</html>
