<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <script>
        let n1 = prompt("Digite o primeiro valor");
        let n2 = prompt("Digite o segundo valor");

        let r = parseInt(n1) + parseInt(n2);
        let r1 = parseInt(n1) - parseInt(n2);
        let r2 = parseInt(n1) * parseInt(n2);
        let r3 = parseInt(n1) / parseInt(n2);

    
        document.write("<h2>Resultado: " + r + "<br></h2>");
        document.write("<h2>Resultado: ", r1 , "<br></h2>");
        document.write("<h2>Resultado: ", r2 , "<br></h2>");
        document.write("<h2>Resultado: ", r3 , "<br></h2>");
    </script>
    
</body>
</html>
